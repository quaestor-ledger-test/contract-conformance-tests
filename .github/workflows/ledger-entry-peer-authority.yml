name: Quaestor ledger-entry peer-authority convergence

on:
  pull_request:
    paths:
      - "contracts/ledger-entry/**"
      - ".github/workflows/ledger-entry-peer-authority.yml"
  push:
    branches: [main]
    paths:
      - "contracts/ledger-entry/**"
      - ".github/workflows/ledger-entry-peer-authority.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  peer-authority:
    uses: flags-2-env-test/contract-conformance-tests/.github/workflows/peer-authority-convergence.yml@ffaaa6bb025de65ea4440d78c61722adc94ac090
    with:
      typespec_path: contracts/ledger-entry/main.tsp
      schema_path: contracts/ledger-entry/authored.schema.json
      instances_path: contracts/ledger-entry/instances
      expected_declarations_json: '["QuaestorLedger.LedgerEntryV1"]'
